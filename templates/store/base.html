{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Whoosh{% endblock %}</title>
  
  <link rel="stylesheet" href="{% static 'css/store.css' %}">
</head>
<body>
  <header class="topbar">
    <div class="container nav">
      <div class="logo">
        <span class="logo-badge">!^!</span>
        <span>Whoosh BabyCo</span>
      </div>
      <nav class="nav-links">
        <a href="{% url 'home' %}" aria-label="Home">🏠</a>
        <a href="{% url 'profile' %}" aria-label="Profile">👤</a>
        <a href="{% url 'cart' %}" aria-label="Cart">🛒</a>
        {% if request.user.is_authenticated %}
          <a href="{% url 'logout' %}" aria-label="Log out">Logout</a>
        {% else %}
          <a href="{% url 'login_page' %}" aria-label="Log in">Login</a>
        {% endif %}
      </nav>
    </div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    <div class="footer-inner container">
      <div>&copy; 2026 whoosh</div>
      <div>Made with care · <a href="{% url 'contact' %}">Contact</a></div>
    </div>
  </footer>
</body>
</html>
