<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Whoosh - Your Details</title>
  <style>
    :root{--brand:#0b69a3;--accent:#ff6f61;--ink:#222;--muted:#68737d;--line:#e3e8ec;--bg:#f7fafc}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
    header{background:#fff;border-bottom:1px solid var(--line)}
    nav{max-width:900px;margin:auto;padding:15px 20px;display:flex;justify-content:space-between;align-items:center}
    nav a{color:var(--brand);font-weight:700;text-decoration:none}
    main{max-width:900px;margin:auto;padding:44px 20px}
    .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:28px}
    h1{margin:0 0 8px}.intro{color:var(--muted);margin:0 0 28px}
    dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 28px;margin:0}
    dt{color:var(--muted);font-size:13px;margin-bottom:5px}dd{margin:0;font-weight:600;min-height:20px}
    .actions{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap}
    button,.button{border:0;border-radius:7px;padding:11px 16px;font-weight:700;cursor:pointer;text-decoration:none}
    .button{background:var(--brand);color:#fff}.secondary{background:#edf1f4;color:var(--ink)}
    .message{margin-top:16px;color:var(--muted)}
    @media(max-width:600px){dl{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header><nav><a href="whoosh_babyco.html">wHoosH</a><a href="cart.html">Cart</a></nav></header>
  <main>
    <section class="card">
      <h1>Your details</h1>
      <p class="intro" id="intro">Your saved account information.</p>
      <dl id="details" aria-live="polite"></dl>
      <div class="actions">
        <a class="button" id="editButton" href="#">Update details</a>
        <a class="button secondary" href="whoosh_babyco.html">Back to home</a>
      </div>
      <p class="message" id="message"></p>
    </section>
  </main>
  <script>
    const details = document.getElementById('details');
    const message = document.getElementById('message');
    const intro = document.getElementById('intro');
    const editButton = document.getElementById('editButton');

    function getSession(){
      try { return JSON.parse(localStorage.getItem('whoosh_logged_in_user') || 'null'); } catch (error) { return null; }
    }
    function escapeHtml(value){
      return String(value || '').replace(/[&<>'"]/g, (character) => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[character]));
    }
    async function loadProfile(){
      const session = getSession();
      if (!session || !session.email) {
        window.location.href = 'admin/login.html';
        return;
      }
      try {
        const response = await fetch('http://localhost:8000/api/user-details', {
          method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({email: session.email}),
        });
        const result = await response.json();
        if (!response.ok || !result.success) throw new Error(result.message || 'Unable to load your details.');
        const user = result.user;
        intro.textContent = `Signed in as ${user.email}.`;
        const fields = [['Name', user.name], ['Date of birth', user.dob], ['Gender', user.gender], ['Email', user.email], ['Phone', user.phone], ['Building / street', user.building_no], ['Locality', user.locality], ['City', user.city], ['District', user.district], ['Country', user.country], ['Pincode', user.pincode], ['Landmark', user.landmark]];
        details.innerHTML = fields.map(([label, value]) => `<div><dt>${label}</dt><dd>${escapeHtml(value) || 'Not provided'}</dd></div>`).join('');
        editButton.href = `admin/login.html?edit=1&email=${encodeURIComponent(user.email)}`;
      } catch (error) {
        message.textContent = error.message;
      }
    }
    loadProfile();
  </script>
</body>
</html>
