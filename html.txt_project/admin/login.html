<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yellow Login</title>
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <div class="page-wrapper">
      <div class="login-card">
        <div class="brand-row">
          <div class="brand-mark">Y</div>
          <div>
            <p class="eyebrow">Welcome</p>
            <h1>Create your account</h1>
          </div>
        </div>

        <form id="signupForm" novalidate>
          <div class="two-col">
            <label>
              <span>Name</span>
              <input type="text" id="name" name="name" placeholder="Enter your full name" required />
            </label>

            <label>
              <span>Date of birth</span>
              <input type="date" id="dob" name="dob" required />
            </label>
          </div>

          <label>
            <span>Gender</span>
            <div class="gender-row">
              <label class="option-pill"><input type="radio" name="gender" value="Male" /> Male</label>
              <label class="option-pill"><input type="radio" name="gender" value="Female" /> Female</label>
              <label class="option-pill"><input type="radio" name="gender" value="Other" /> Other</label>
            </div>
          </label>

          <div class="otp-group">
            <label>
              <span>Email</span>
              <input type="email" id="email" name="email" placeholder="example@email.com" required />
            </label>
            <button type="button" class="tiny-btn" id="sendEmailOtp">Send OTP</button>
          </div>

          <label>
            <span>Phone</span>
            <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required />
          </label>

          <div class="otp-box hidden" id="emailOtpBox">
            <input type="text" id="emailOtp" maxlength="6" placeholder="Enter 6-digit email OTP" />
            <button type="button" class="verify-btn" id="verifyEmailOtp">Verify Email</button>
            <p id="emailStatus" class="status-text"></p>
          </div>

          <div class="password-field">
            <label for="password"><span>New password</span></label>
            <div class="password-input-wrap">
              <input type="password" id="password" name="password" placeholder="Enter your password" required aria-describedby="passwordRequirements" />
              <button type="button" class="password-toggle" data-target="password" aria-label="Show password">&#128065;</button>
            </div>
            <details class="password-requirements" id="passwordRequirements">
              <summary>Password requirements</summary>
              <ul>
                <li data-rule="length">More than 8 characters</li>
                <li data-rule="uppercase">One capital letter (A-Z)</li>
                <li data-rule="lowercase">One lowercase letter (a-z)</li>
                <li data-rule="number">One number (0-9)</li>
                <li data-rule="special">One special character</li>
              </ul>
            </details>
          </div>

          <div class="password-field">
            <label for="confirmPassword"><span>Confirm password</span></label>
            <div class="password-input-wrap">
              <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your password" required aria-describedby="confirmPasswordStatus" />
              <button type="button" class="password-toggle" data-target="confirmPassword" aria-label="Show confirm password">&#128065;</button>
            </div>
            <p id="confirmPasswordStatus" class="status-text"></p>
          </div>

          <details class="address-panel" id="addressPanel" inert>
            <summary>Address</summary>
            <div class="address-fields">
              <div class="two-col">
                <label>
                  <span>Building no./Street no.</span>
                  <input type="text" id="building" name="building" placeholder="Building / street number" />
                </label>
                <label>
                  <span>Locality</span>
                  <input type="text" id="locality" name="locality" placeholder="Locality" />
                </label>
              </div>

              <div class="two-col">
                <label>
                  <span>City</span>
                  <input type="text" id="city" name="city" placeholder="City" />
                </label>
                <label>
                  <span>District</span>
                  <input type="text" id="district" name="district" placeholder="District" />
                </label>
              </div>

              <div class="two-col">
                <label>
                  <span>Country</span>
                  <input type="text" id="country" name="country" placeholder="Country" />
                </label>
                <label>
                  <span>Pincode</span>
                  <input type="text" id="pincode" name="pincode" placeholder="Pincode" />
                </label>
              </div>

              <label>
                <span>Landmark</span>
                <input type="text" id="landmark" name="landmark" placeholder="Nearest landmark" />
              </label>
            </div>
          </details>

          <button type="submit" class="submit-btn" id="submitButton" disabled>Submit</button>
        </form>
      </div>
    </div>

    <script src="login.js"></script>
  </body>
</html>
