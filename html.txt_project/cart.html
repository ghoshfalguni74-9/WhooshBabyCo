<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Whoosh - Cart</title>
  <style>
    :root{--brand:#0b69a3;--accent:#ff6f61;--ink:#222;--muted:#6f7780;--line:#e6e9ec;--bg:#f7fafc}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
    .topbar{background:#fff;border-bottom:1px solid var(--line)}
    .nav{max-width:1100px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between}
    .brand{color:var(--brand);font-size:24px;font-weight:800;text-decoration:none}
    .nav a{color:var(--ink);text-decoration:none;font-weight:600}
    main{max-width:900px;margin:0 auto;padding:48px 20px}
    h1{margin:0 0 8px;font-size:38px}
    .intro{margin:0 0 28px;color:var(--muted)}
    .cart-layout{display:grid;grid-template-columns:1fr 280px;gap:22px;align-items:start}
    .items,.summary{background:#fff;border:1px solid var(--line);border-radius:10px}
    .items{padding:8px 20px}
    .cart-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 0;border-bottom:1px solid var(--line)}
    .cart-row:last-child{border-bottom:0}
    .cart-row h2{font-size:18px;margin:0 0 5px}
    .cart-row p{margin:0;color:var(--muted);font-size:14px}
    .quantity{display:flex;align-items:center;gap:10px;white-space:nowrap}
    .quantity button,.remove{border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer}
    .quantity button{width:30px;height:30px;font-size:18px}
    .remove{padding:7px 9px;color:#b33;font-size:12px}
    .summary{padding:20px;position:sticky;top:20px}
    .summary h2{margin:0 0 18px;font-size:20px}
    .summary-line{display:flex;justify-content:space-between;margin:10px 0;color:var(--muted)}
    .summary-total{border-top:1px solid var(--line);padding-top:14px;font-weight:800;color:var(--ink)}
    .clear{width:100%;margin-top:15px;padding:11px;border:0;border-radius:7px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}
    .empty{padding:36px 10px;text-align:center;color:var(--muted)}
    .empty a{display:inline-block;margin-top:14px;color:var(--brand);font-weight:700}
    @media(max-width:680px){.cart-layout{grid-template-columns:1fr}.summary{position:static}.cart-row{align-items:flex-start;flex-wrap:wrap}.quantity{width:100%;justify-content:flex-end}}
  </style>
</head>
<body>
  <header class="topbar">
    <nav class="nav" aria-label="Main navigation">
      <a class="brand" href="whoosh_babyco.html">wHoosH</a>
      <a href="whoosh_babyco.html">Continue shopping</a>
    </nav>
  </header>

  <main>
    <h1>Your cart</h1>
    <p class="intro" id="cartIntro">Review the items you have selected.</p>
    <div class="cart-layout">
      <section class="items" id="cartItems" aria-live="polite"></section>
      <aside class="summary">
        <h2>Order summary</h2>
        <div class="summary-line"><span>Items</span><span id="itemCount">0</span></div>
        <div class="summary-line summary-total"><span>Total items</span><span id="totalCount">0</span></div>
        <button type="button" class="clear" id="clearCart">Clear cart</button>
      </aside>
    </div>
  </main>

  <script>
    const cartItems = document.getElementById('cartItems');
    const itemCount = document.getElementById('itemCount');
    const totalCount = document.getElementById('totalCount');
    const cartIntro = document.getElementById('cartIntro');

    function readCart(){
      try {
        const items = JSON.parse(localStorage.getItem('whoosh_cart') || '[]');
        return Array.isArray(items) ? items : [];
      } catch (error) {
        return [];
      }
    }

    function writeCart(items){
      localStorage.setItem('whoosh_cart', JSON.stringify(items));
      renderCart();
    }

    function renderCart(){
      const items = readCart();
      const total = items.reduce((sum, item) => sum + item.quantity, 0);
      itemCount.textContent = total;
      totalCount.textContent = total;
      cartIntro.textContent = total ? `${total} item${total === 1 ? '' : 's'} in your cart.` : 'Your cart is currently empty.';

      if (!items.length) {
        cartItems.innerHTML = '<div class="empty">Your cart is empty.<br><a href="whoosh_babyco.html#featured">Explore featured products</a></div>';
        return;
      }

      cartItems.innerHTML = items.map((item, index) => `
        <article class="cart-row">
          <div><h2>${escapeHtml(item.name)}</h2><p>Whoosh baby care</p></div>
          <div class="quantity">
            <button type="button" data-action="decrease" data-index="${index}" aria-label="Decrease ${escapeHtml(item.name)} quantity">-</button>
            <strong>${item.quantity}</strong>
            <button type="button" data-action="increase" data-index="${index}" aria-label="Increase ${escapeHtml(item.name)} quantity">+</button>
            <button type="button" class="remove" data-action="remove" data-index="${index}">Remove</button>
          </div>
        </article>`).join('');
    }

    function escapeHtml(value){
      return String(value).replace(/[&<>'"]/g, (character) => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[character]));
    }

    cartItems.addEventListener('click', (event) => {
      const button = event.target.closest('button[data-action]');
      if (!button) return;
      const items = readCart();
      const index = Number(button.dataset.index);
      const action = button.dataset.action;
      if (!items[index]) return;
      if (action === 'increase') items[index].quantity += 1;
      if (action === 'decrease') items[index].quantity -= 1;
      if (action === 'remove' || items[index].quantity <= 0) items.splice(index, 1);
      writeCart(items);
    });

    document.getElementById('clearCart').addEventListener('click', () => writeCart([]));
    renderCart();
  </script>
</body>
</html>
