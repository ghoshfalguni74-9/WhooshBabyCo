<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Whoosh | Nutrition</title>
  <style>
    :root {
      --brand: #0b69a3;
      --brand-dark: #094b7d;
      --accent: #ff6f61;
      --bg: #f5f7fb;
      --panel: #ffffff;
      --panel-soft: #eef4fb;
      --text: #1f2937;
      --muted: #6b7280;
      --success-bg: #ebf9f1;
      --success-text: #1d5c3d;
      --border: #dfe7f2;
      --shadow: rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: Inter, Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .topbar {
      background: #fff;
      border-bottom: 1px solid var(--border);
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--brand);
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .logo-badge {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--brand), var(--brand-dark));
      color: #fff;
      display: grid;
      place-items: center;
      box-shadow: 0 6px 14px rgba(11,105,163,0.25);
      font-size: 22px;
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1;
      font-weight: 800;
    }

    .nav-links {
      display: flex;
      gap: 18px;
      align-items: center;
    }

    .nav-links a {
      color: #333;
      text-decoration: none;
      font-weight: 600;
      font-size: 20px;
      padding: 6px 10px;
      border-radius: 6px;
    }

    .nav-links a:hover {
      background: rgba(0,0,0,0.04);
    }

    .hero {
      background:
        linear-gradient(rgba(11, 105, 163, 0.7), rgba(11, 105, 163, 0.78)),
        url('https://tophealthdoctors.com.au/wp-content/uploads/2024/09/healthy-eating-for-kids.jpg') center/cover no-repeat;
      color: white;
      border-radius: 18px;
      margin-top: 28px;
      padding: 34px 24px;
      box-shadow: 0 16px 34px rgba(11,105,163,0.18);
      position: relative;
      overflow: hidden;
      min-height: 220px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .hero::before,
    .hero::after {
      content: "";
      position: absolute;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      top: -70px;
      right: -30px;
    }

    .hero::after {
      width: 120px;
      height: 120px;
      left: 10%;
      bottom: -30px;
      top: auto;
    }

    .hero h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 4vw, 3rem);
      position: relative;
      z-index: 1;
    }

    .subtitle {
      margin: 0;
      font-size: 1.05rem;
      opacity: 0.96;
      position: relative;
      z-index: 1;
    }

    .card {
      background: var(--panel);
      border-radius: 18px;
      box-shadow: 0 10px 25px var(--shadow);
      padding: 28px 24px;
      margin-top: 24px;
    }

    .row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }

    form {
      display: grid;
      gap: 18px;
    }

    label {
      display: grid;
      gap: 8px;
      font-weight: 700;
      color: var(--text);
    }

    input, select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 1rem;
      background: #fff;
      color: var(--text);
    }

    .btn {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      border: 0;
      border-radius: 10px;
      padding: 12px 20px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      opacity: 0.96;
    }

    .result-box {
      background: var(--success-bg);
      border: 1px solid #cbeed8;
      border-radius: 12px;
      padding: 18px;
      color: var(--success-text);
      line-height: 1.5;
    }

    .result-box strong {
      display: block;
      margin-bottom: 8px;
      font-size: 1.08rem;
    }

    .back {
      display: inline-block;
      margin-top: 20px;
      color: var(--brand);
      text-decoration: none;
      font-weight: 700;
    }

    @media (max-width: 600px) {
      .nav-links { display: none; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="container nav">
      <div class="logo">
        <span class="logo-badge">!^!</span>
        <span>Whoosh BabyCo</span>
      </div>
      <nav class="nav-links">
        <a href="whoosh_babyco.html" aria-label="Home">🏠</a>
      </nav>
    </div>
  </div>

  <div class="container">
    <section class="hero">
      <h1>Nutrition Calculator</h1>
      <p class="subtitle">Estimate your child's nutrition values and daily essentials.</p>
    </section>

    <div class="card">
      <form id="nutritionForm">
        <div class="row">
          <label>
            Child age
            <input type="number" id="age" min="1" max="18" value="5">
          </label>
          <label>
            Weight (kg)
            <input type="number" id="weight" min="5" max="80" step="0.1" value="18">
          </label>
          <label>
            Height (cm)
            <input type="number" id="height" min="40" max="180" step="0.1" value="110">
          </label>
        </div>

        <div class="row">
          <label>
            Activity level
            <select id="activity">
              <option value="1.2">Low</option>
              <option value="1.4" selected>Normal</option>
              <option value="1.6">Active</option>
            </select>
          </label>
          <label>
            Food preference
            <select id="foodType">
              <option value="vegetarian">Vegetarian</option>
              <option value="nonveg">Non-vegetarian</option>
              <option value="mixed" selected>Mixed</option>
            </select>
          </label>
        </div>

        <button type="submit" class="btn">Calculate nutrition</button>

        <div class="result-box" id="resultBox">
          <strong>Estimated daily nutrition</strong>
          Protein: 18g • Calories: 1200 kcal • Water: 1.2L
        </div>
      </form>
    </div>

    <a class="back" href="whoosh_babyco.html">← Return to home</a>
  </div>

  <script>
    document.getElementById('nutritionForm').addEventListener('submit', function (event) {
      event.preventDefault();

      const age = Number(document.getElementById('age').value) || 5;
      const weight = Number(document.getElementById('weight').value) || 18;
      const height = Number(document.getElementById('height').value) || 110;
      const activity = Number(document.getElementById('activity').value) || 1.4;
      const foodType = document.getElementById('foodType').value || 'mixed';

      const calories = Math.round((22 * weight + 500 + age * 10) * activity);
      const protein = Math.round(weight * 1.8 + age * 0.5);
      const water = (weight * 0.07).toFixed(1);

      let foodMessage = 'Balanced meal plan';
      if (foodType === 'vegetarian') foodMessage = 'Vegetarian protein-rich plan';
      if (foodType === 'nonveg') foodMessage = 'Protein-balanced mixed plan';

      document.getElementById('resultBox').innerHTML = `
        <strong>Estimated daily nutrition</strong>
        Calories: ${calories} kcal • Protein: ${protein}g • Water: ${water}L<br>
        Recommendation: ${foodMessage} for healthy growth and development.
      `;
    });
  </script>
</body>
</html>
